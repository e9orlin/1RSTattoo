<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <!-- Pure White Background so the automatic background remover / Multiply blend mode can be demonstrated -->
  <rect width="400" height="600" fill="#ffffff"/>
  <g stroke="#09090c" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cobra Silhouette -->
    <path d="M 200,60 C 160,85 130,135 150,185 C 170,235 240,215 250,275 C 265,335 175,375 165,435 C 155,495 235,525 200,565" stroke="#111" stroke-width="8"/>
    <!-- Head and Hood -->
    <path d="M 175,95 C 140,110 130,145 150,175 C 165,195 185,200 200,200 C 215,200 235,195 250,175 C 270,145 260,110 225,95 Z" fill="#151515" stroke="#000" stroke-width="3"/>
    <path d="M 200,60 C 180,70 175,85 185,100 C 195,115 205,115 215,100 C 225,85 220,70 200,60 Z" fill="#050505"/>
    <!-- Eyes & Fangs -->
    <circle cx="185" cy="85" r="3" fill="#ffffff"/>
    <circle cx="215" cy="85" r="3" fill="#ffffff"/>
    <path d="M 190,115 Q 200,135 195,150 M 210,115 Q 200,135 205,150" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 165,150 C 180,170 220,170 235,150" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 170,165 C 185,185 215,185 230,165" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Body Ribs & Scales -->
    <path d="M 170,220 C 190,230 220,230 240,210" stroke-width="3.5"/>
    <path d="M 180,245 C 200,255 230,250 250,230" stroke-width="3.5"/>
    <path d="M 190,270 C 210,280 245,270 255,250" stroke-width="3.5"/>
    <path d="M 195,300 C 220,310 245,290 250,270" stroke-width="3.5"/>
    <path d="M 185,330 C 210,340 230,320 235,300" stroke-width="3.5"/>
    <path d="M 170,360 C 190,370 210,350 215,330" stroke-width="3.5"/>
    <path d="M 160,390 C 175,405 195,385 195,365" stroke-width="3.5"/>
    <path d="M 160,420 C 175,435 185,415 185,395" stroke-width="3.5"/>
    <path d="M 170,450 C 185,465 195,445 195,425" stroke-width="3.5"/>
    <path d="M 185,480 C 205,495 215,475 215,455" stroke-width="3.5"/>
    <path d="M 200,510 C 215,525 220,505 215,485" stroke-width="3.5"/>
    <!-- Peony Flower accents -->
    <g transform="translate(200,320)">
      <circle cx="0" cy="0" r="35" fill="#151515"/>
      <circle cx="-15" cy="-15" r="20" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="15" cy="-15" r="20" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="15" r="25" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M -25,0 Q 0,-20 25,0 Q 0,25 -25,0" fill="#ffffff"/>
    </g>
    <!-- Wind & smoke -->
    <path d="M 80,180 C 120,170 140,200 160,190" stroke="#333" stroke-width="2.5" stroke-dasharray="5 5"/>
    <path d="M 250,220 C 280,210 310,240 330,230" stroke="#333" stroke-width="2.5" stroke-dasharray="5 5"/>
  </g>
</svg>
